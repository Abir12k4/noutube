<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PANDA IS NOW ON NOU-TUBE</title>

<!-- <you will not able to find bugg in my code> -->

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    width:100%;
    min-height:100%;
    background:#000;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    overflow-x:hidden;
}

/* <you will not able to find bugg in my code> */

.photo-section{
    position:relative;
    width:100%;
    height:100vh;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;
    overflow:hidden;
}

/* <you will not able to find bugg in my code> */

.main-photo{
    width:100%;
    height:100%;

    object-fit:contain;
    object-position:center;

    display:block;

    filter:
        brightness(0.92)
        contrast(1.08)
        saturate(1.15);

    animation:photoAppear 2s ease;
}

/* <you will not able to find bugg in my code> */

@keyframes photoAppear{

    from{
        opacity:0;
        transform:scale(1.03);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* <you will not able to find bugg in my code> */

.photo-section::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            transparent 55%,
            rgba(0,0,0,0.25) 80%,
            rgba(0,0,0,0.8) 100%
        );

    pointer-events:none;
}

/* <you will not able to find bugg in my code> */

.down-area{
    position:absolute;

    z-index:20;

    top:35px;

    left:50%;

    transform:translateX(-50%);

    display:flex;
    flex-direction:column;
    align-items:center;

    cursor:pointer;

    filter:
        drop-shadow(0 0 8px #00ff66)
        drop-shadow(0 0 18px rgba(0,255,100,0.8));
}

/* <you will not able to find bugg in my code> */

.down-arrow{
    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    color:#00ff66;

    font-size:34px;

    font-weight:bold;

    line-height:21px;

    text-shadow:
        0 0 5px #00ff66,
        0 0 15px #00ff66,
        0 0 30px #00ff66;

    animation:arrowDown 1.3s infinite ease-in-out;
}

/* <you will not able to find bugg in my code> */

.down-arrow span{
    display:block;
}

/* <you will not able to find bugg in my code> */

@keyframes arrowDown{

    0%{
        transform:translateY(-5px);
        opacity:0.35;
    }

    50%{
        transform:translateY(8px);
        opacity:1;
    }

    100%{
        transform:translateY(-5px);
        opacity:0.35;
    }
}

/* <you will not able to find bugg in my code> */

.download-hint{
    margin-top:8px;

    color:#00ff66;

    font-size:11px;

    font-weight:bold;

    letter-spacing:2px;

    text-shadow:
        0 0 8px #00ff66;
}

/* <you will not able to find bugg in my code> */

.download-section{
    position:relative;

    min-height:100vh;
    width:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:60px 20px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(0,255,100,0.14),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #030303,
            #071006,
            #000
        );

    overflow:hidden;
}

/* <you will not able to find bugg in my code> */

.download-section::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:#00ff66;

    opacity:0.05;

    filter:blur(100px);

    animation:glowMove 6s infinite alternate ease-in-out;
}

/* <you will not able to find bugg in my code> */

@keyframes glowMove{

    0%{
        transform:translate(-150px,-100px);
    }

    100%{
        transform:translate(150px,100px);
    }
}

/* <you will not able to find bugg in my code> */

.title{

    position:relative;

    z-index:2;

    font-size:clamp(28px,6vw,75px);

    font-weight:900;

    letter-spacing:3px;

    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            #00ff66,
            #eaff00,
            #00ff66,
            #ffffff,
            #00ff66
        );

    background-size:300% auto;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:titleGlow 4s linear infinite;
}

/* <you will not able to find bugg in my code> */

@keyframes titleGlow{

    0%{
        background-position:0% center;
    }

    100%{
        background-position:300% center;
    }
}

/* <you will not able to find bugg in my code> */

.science{

    position:relative;

    z-index:2;

    margin-top:30px;

    font-size:clamp(30px,7vw,80px);

    font-weight:1000;

    color:#eaff00;

    letter-spacing:5px;

    text-shadow:
        0 0 5px #eaff00,
        0 0 15px #eaff00,
        0 0 35px #eaff00,
        0 0 70px rgba(234,255,0,0.5);

    animation:sciencePulse 2s infinite alternate;
}

/* <you will not able to find bugg in my code> */

@keyframes sciencePulse{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.04);
    }
}

/* <you will not able to find bugg in my code> */

.walter{

    position:relative;

    z-index:2;

    margin-top:20px;

    font-size:clamp(17px,3vw,28px);

    color:#fff;

    letter-spacing:1px;

    text-shadow:
        0 0 10px rgba(255,255,255,0.6);
}

/* <you will not able to find bugg in my code> */

.inspired{

    position:relative;

    z-index:2;

    margin-top:12px;

    font-size:15px;

    color:#aaa;

    letter-spacing:2px;
}

/* <you will not able to find bugg in my code> */

.subscription-message{

    position:relative;

    z-index:2;

    margin-top:30px;

    font-size:clamp(18px,4vw,32px);

    font-weight:900;

    letter-spacing:2px;

    color:#ffdf00;

    text-shadow:
        0 0 8px #ffdf00,
        0 0 20px rgba(255,223,0,0.8);

    animation:subscriptionPulse 1.8s infinite alternate;
}

/* <you will not able to find bugg in my code> */

@keyframes subscriptionPulse{

    from{
        transform:scale(1);
        opacity:0.75;
    }

    to{
        transform:scale(1.04);
        opacity:1;
    }
}

/* <you will not able to find bugg in my code> */

.download-button{

    position:relative;

    z-index:2;

    margin-top:40px;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:260px;

    padding:18px 35px;

    border-radius:12px;

    border:none;

    background:
        linear-gradient(
            135deg,
            #00ff66,
            #00b847
        );

    color:#000;

    text-decoration:none;

    font-size:20px;

    font-weight:900;

    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 10px #00ff66,
        0 0 30px rgba(0,255,100,0.7),
        0 0 70px rgba(0,255,100,0.35);

    transition:
        transform 0.25s,
        box-shadow 0.25s;
}

/* <you will not able to find bugg in my code> */

.download-button:hover{

    transform:scale(1.08);

    box-shadow:
        0 0 20px #00ff66,
        0 0 50px #00ff66,
        0 0 100px rgba(0,255,100,0.6);
}

/* <you will not able to find bugg in my code> */

.download-button:active{
    transform:scale(0.95);
}

/* <you will not able to find bugg in my code> */

.download-message{

    position:relative;

    z-index:2;

    margin-top:25px;

    min-height:65px;

    font-size:clamp(18px,4vw,30px);

    font-weight:900;

    letter-spacing:3px;

    color:#00ff66;

    text-shadow:
        0 0 8px #00ff66,
        0 0 20px #00ff66;

    opacity:0;

    transform:translateY(10px);

    transition:
        opacity 0.3s,
        transform 0.3s;
}

/* <you will not able to find bugg in my code> */

.download-message.show{

    opacity:1;

    transform:translateY(0);

    animation:downloadFlash 0.8s infinite alternate;
}

/* <you will not able to find bugg in my code> */

.download-message .main-message{
    display:block;
}

/* <you will not able to find bugg in my code> */

.download-message .credit{

    display:block;

    margin-top:8px;

    font-size:13px;

    color:#aaa;

    letter-spacing:2px;

    text-shadow:none;
}

/* <you will not able to find bugg in my code> */

@keyframes downloadFlash{

    from{
        text-shadow:
            0 0 8px #00ff66,
            0 0 20px #00ff66;
    }

    to{
        text-shadow:
            0 0 15px #00ff66,
            0 0 40px #00ff66;
    }
}

/* <you will not able to find bugg in my code> */

.particle{

    position:absolute;

    width:4px;

    height:4px;

    background:#00ff66;

    border-radius:50%;

    box-shadow:
        0 0 8px #00ff66,
        0 0 15px #00ff66;

    animation:particleFloat linear infinite;
}

/* <you will not able to find bugg in my code> */

.p1{
    left:10%;
    bottom:-10px;
    animation-duration:7s;
}

.p2{
    left:25%;
    bottom:-10px;
    animation-duration:10s;
}

.p3{
    left:42%;
    bottom:-10px;
    animation-duration:8s;
}

.p4{
    left:61%;
    bottom:-10px;
    animation-duration:12s;
}

.p5{
    left:78%;
    bottom:-10px;
    animation-duration:9s;
}

.p6{
    left:90%;
    bottom:-10px;
    animation-duration:11s;
}

/* <you will not able to find bugg in my code> */

@keyframes particleFloat{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        transform:translateY(-100vh);
        opacity:0;
    }
}

/* <you will not able to find bugg in my code> */

.scanline{

    position:absolute;

    left:0;

    width:100%;

    height:2px;

    background:rgba(0,255,100,0.12);

    z-index:3;

    animation:scan 5s linear infinite;

    pointer-events:none;
}

/* <you will not able to find bugg in my code> */

@keyframes scan{

    0%{
        top:-5%;
    }

    100%{
        top:105%;
    }
}

/* <you will not able to find bugg in my code> */

@media(max-width:600px){

    .down-area{
        top:25px;
    }

    .down-arrow{

        line-height:19px;
    }

    .download-section{
        padding:40px 15px;
    }

    .title{
        letter-spacing:2px;
    }

    .science{
        letter-spacing:3px;
    }

    .download-button{

</style>
</head>

<body>

<!-- <you will not able to find bugg in my code> -->

<section class="photo-section" id="top">

    <img

    <div class="scanline"></div>

    <!-- <you will not able to find bugg in my code> -->

        <div class="down-arrow">

            <span>↓</span>
        </div>

        <div class="download-hint">

</section>


<!-- <you will not able to find bugg in my code> -->

<section class="download-section" id="download">

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

</section>


<!-- <you will not able to find bugg in my code> -->

<script>

/* <you will not able to find bugg in my code> */

function goToDownload(){

    document
        .getElementById("download")
        .scrollIntoView({
            behavior:"smooth"
        });

}

/* <you will not able to find bugg in my code> */

function startDownload(){

    const message =
        document.getElementById("downloadMessage");

    message.classList.add("show");

    setTimeout(function(){

        message.classList.remove("show");

    },5000);

}

/* <you will not able to find bugg in my code> */

</script>

</body>
